[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "barakusyn-quantize_jd198"
version = "0.1.0"
description = "通过字符级与结构级特征识别量化与稀疏化研究员·函数调用的 schema 校验的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "barakusyn" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://barakusyn.github.io"
Repository = "https://github.com/barakusyn/quantize_jd198"
Issues = "https://github.com/barakusyn/quantize_jd198/issues"

[project.scripts]
quantize_jd198 = "quantize_jd198:main"

[tool.setuptools]
py-modules = ["quantize_jd198"]
